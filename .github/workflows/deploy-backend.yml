name: Deploy backend (EC2)

# Compila el backend, sube el .jar a S3 y le pide a la EC2 (vía SSM Run Command)
# que lo descargue, reinicie el servicio y verifique que levantó.
# Configuración necesaria en AWS y GitHub: deploy/ec2/README.md

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "deploy/ec2/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  id-token: write # necesario para OIDC con AWS
  contents: read

# Nunca dos despliegues en paralelo; si llega otro push, espera al anterior.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
  APP_SERVICE: ${{ vars.APP_SERVICE || 'space-venue-api' }}
  APP_DIR: ${{ vars.APP_DIR || '/opt/space-venue-api' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compilar y empaquetar
        working-directory: backend
        run: ./mvnw -B -ntp package

      - name: Credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Subir .jar a S3
        id: upload
        run: |
          JAR=$(ls backend/target/*.jar | head -n1)
          URI="s3://${DEPLOY_BUCKET}/backend/${GITHUB_SHA}.jar"
          aws s3 cp "$JAR" "$URI"
          echo "uri=$URI" >> "$GITHUB_OUTPUT"

      - name: Desplegar en EC2 vía SSM
        env:
          JAR_S3_URI: ${{ steps.upload.outputs.uri }}
        run: |
          set -euo pipefail

          # El script de despliegue vive en el repo; se le anteponen sus variables.
          SCRIPT="$(printf "JAR_S3_URI='%s'\nAPP_SERVICE='%s'\nAPP_DIR='%s'\n" \
            "$JAR_S3_URI" "$APP_SERVICE" "$APP_DIR"; cat deploy/ec2/deploy.sh)"
          jq -n --arg s "$SCRIPT" '{commands: [$s], executionTimeout: ["600"]}' > ssm-params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters file://ssm-params.json \
            --query Command.CommandId --output text)
          echo "Comando SSM: $CMD_ID"

          STATUS=Pending
          for _ in $(seq 1 120); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done

          echo "----- salida en la EC2 -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "----- errores en la EC2 -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query StandardErrorContent --output text

          echo "Estado final: $STATUS"
          test "$STATUS" = Success
