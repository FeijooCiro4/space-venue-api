server {
    listen 80;
    server_name localhost;

    # Sirve los archivos estáticos del frontend
    root /usr/share/nginx/html;
    index index.html;

    # Cualquier ruta que no sea /api se resuelve como archivo estático
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso optimizado dinámicamente para la red de Render
    location /api/ {
        # Resolver DNS interno de Render (evita que Nginx falle si el back no está listo)
        resolver 127.0.0.11 valid=30s;

        # Guardamos el host en una variable para forzar la resolución dinámica
        set $backend_upstream http://spacevenue-backend:8080;

        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Tiempo de espera ampliado (para respuestas de MercadoPago / Google Calendar)
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}