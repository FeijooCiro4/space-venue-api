services:
  db:
    image: mysql:8.0
    container_name: spacevenue-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Completá DB_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${DB_NAME:-space_venue_db}
      MYSQL_USER: ${DB_USER:-spacevenue}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Completá DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:${DB_PORT:-3308}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: spacevenue-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${DB_NAME:-space_venue_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-spacevenue}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:3000,http://localhost:5173}
      PAYMENT_SUCCESS_URL: ${PAYMENT_SUCCESS_URL:-}
      PAYMENT_FAILURE_URL: ${PAYMENT_FAILURE_URL:-}
      PAYMENT_PENDING_URL: ${PAYMENT_PENDING_URL:-}
      PORT: 8080
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  db_data:
