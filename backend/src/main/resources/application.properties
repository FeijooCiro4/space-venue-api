spring.application.name=space-venueaapi

server.port=${PORT:8080}

# Configuración de codificación de caracteres para evitar los caracteres especiales
server.serverlet.encoding.charset=UTF-8
server.serverlet.encoding.enabled=true
server.serverlet.encoding.force=true

mercadopago.access.token=${MP_ACCESS_TOKEN:}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyHbmImpl


# Orígenes del cliente, separados por comas y sin barra final.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost,http://127.0.0.1,http://localhost:3000,http://localhost:5173,http://localhost:4200}

# Destinos de retorno de Mercado Pago, configurados por despliegue.
app.client.payment-success-url=${PAYMENT_SUCCESS_URL:}
app.client.payment-failure-url=${PAYMENT_FAILURE_URL:}
app.client.payment-pending-url=${PAYMENT_PENDING_URL:}

# Clave estable y compartida por todas las instancias; sin valor inseguro por defecto.
app.jwt.secret-base64=${JWT_SECRET_BASE64:}

# Bucket S3 donde se guardan las imágenes de los espacios (se sirven por CloudFront en /media/*).
# Las credenciales las toma el SDK del rol IAM de la EC2 (o de AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY en local).
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:}
