spring.application.name=space-venueaapi

server.port=8080

# cambiar username y password segun la implemenacion final
mercadopago.access.token=${MP_ACCESS_TOKEN:}
spring.datasource.url=jdbc:mysql://localhost:3306/space_venue_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root 
spring.datasource.password=utn12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyHbmImpl


# Orígenes del cliente, separados por comas y sin barra final.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost,http://127.0.0.1,http://localhost:3000,http://localhost:5173}

# Destinos de retorno de Mercado Pago, configurados por despliegue.
app.client.payment-success-url=${PAYMENT_SUCCESS_URL:}
app.client.payment-failure-url=${PAYMENT_FAILURE_URL:}
app.client.payment-pending-url=${PAYMENT_PENDING_URL:}

