# Base de datos SOLO para pruebas locales. No tiene datos de producción.
# Usa el puerto 3307 para no chocar con un MySQL instalado en la máquina (3306).
services:
  mysql-local:
    image: mysql:8.4
    container_name: space-venue-mysql-local
    environment:
      MYSQL_DATABASE: space_venue_db
      MYSQL_USER: spacevenue
      MYSQL_PASSWORD: spacevenue-local
      MYSQL_ROOT_PASSWORD: root-local
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - space-venue-mysql-local-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot-local"]
      interval: 3s
      retries: 30

volumes:
  space-venue-mysql-local-data:
