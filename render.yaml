services:
  # ──────────────────────────────────────────────
  #  Backend Spring Boot
  # ──────────────────────────────────────────────
  - type: web
    name: spacevenue-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: ohio
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - fromGroup: spacevenue-secrets

# ──────────────────────────────────────────────
#  Grupo de Variables de Entorno
# ──────────────────────────────────────────────
envVarGroups:
  - name: spacevenue-secrets
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: PAYMENT_SUCCESS_URL
        sync: false
      - key: PAYMENT_FAILURE_URL
        sync: false
      - key: PAYMENT_PENDING_URL
        sync: false
