services:
  # ──────────────────────────────────────────────
  #  Frontend Nginx
  # ──────────────────────────────────────────────
  - type: web
    name: spacevenue-frontend
    env: docker
    dockerfile: ./frontend/Dockerfile
    region: ohio
    plan: free
    ports:
      - key: 80

  # ──────────────────────────────────────────────
  #  Backend Spring Boot
  # ──────────────────────────────────────────────
  - type: pserv
    name: spacevenue-backend
    env: docker
    dockerfile: ./Dockerfile
    region: ohio
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - fromGroup: spacevenue-secrets
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - key: SPRING_DATASOURCE_USERNAME
        value: ${DB_USER}
      - key: SPRING_DATASOURCE_PASSWORD
        value: ${DB_PASSWORD}
      - key: MP_ACCESS_TOKEN
        value: ${MERCADOPAGO_ACCESS_TOKEN}

# ──────────────────────────────────────────────
#  Grupo de Variables de Entorno
# ──────────────────────────────────────────────
envGroups:
  - name: spacevenue-secrets
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        value: space_venue_db
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: GOOGLE_OAUTH2_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH2_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH2_REDIRECT_URI
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: GOOGLE_CREDENTIALS_BASE64
        sync: false
      - key: ID_FOR_GOOGLE_CALENDAR
        sync: false
