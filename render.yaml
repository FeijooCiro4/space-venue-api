services:
  # ──────────────────────────────────────────────
  #  Frontend Nginx
  # ──────────────────────────────────────────────
  - type: web
    name: spacevenue-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    region: ohio
    plan: free

  # ──────────────────────────────────────────────
  #  Backend Spring Boot
  # ──────────────────────────────────────────────
  - type: pserv
    name: spacevenue-backend
    env: docker
    dockerfilePath: ./Dockerfile
    region: ohio
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - fromGroup: spacevenue-secrets
